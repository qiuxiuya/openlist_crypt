# password/salt 支持三种写法：
# 1. 明文，例如 password = "your password"
# 2. OpenList 保存的值，例如 password = "___Obfuscated___..."
# 3. rclone obscure 后的值，例如 password = "..."

password = "password"
salt = "salt"

#文件名编码 ( base64 / base32 / base32768 )

filename_encoding = "base64"

# 文件夹是否加密(true/false)

folder_name_encryption = true

#文件名加密( off / standard / obfuscate )

file_name_encryption = "standard"

# 加密文件后缀
encrypted_suffix = ".bin"